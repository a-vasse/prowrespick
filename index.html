<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mania Oracle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: linear-gradient(180deg, #111827, #1f2937); }
    .tab-active { border-bottom: 4px solid #f59e0b; color: #f59e0b; }
    .match-card { transition: all 0.2s; }
  </style>
</head>
<body class="min-h-screen text-white pb-12">
  <div class="max-w-5xl mx-auto p-4">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-bold flex items-center gap-3">
        <span class="text-yellow-400">👊🏻</span> Mania Oracle
      </h1>
      <div class="flex gap-3">
        <button onclick="newEvent()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm flex items-center gap-2">
          <i class="fas fa-plus"></i> New Event
        </button>
        <button onclick="exportEvent()" class="px-5 py-2.5 bg-yellow-400 hover:bg-yellow-300 text-black font-bold rounded-2xl text-sm flex items-center gap-2">
          <i class="fas fa-download"></i> Export
        </button>
        <button onclick="showImportModal()" class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-2xl text-sm flex items-center gap-2">
          <i class="fas fa-upload"></i> Import
        </button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-gray-700 mb-8 text-lg font-medium" id="tabs"></div>

    <!-- Panels -->
    <div id="panel0" class="tab-panel"></div>
    <div id="panel1" class="tab-panel hidden"></div>
    <div id="panel2" class="tab-panel hidden"></div>
    <div id="panel3" class="tab-panel hidden"></div>
    <div id="panel4" class="tab-panel hidden"></div>
  </div>

  <!-- Import Modal -->
  <div id="importModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50"></div>

<script>
  // ==================== STATE ====================
  let eventName = "";
  let eventType = "mania";   // "mania" or "rumble"
  let matches = [];
  let players = [];

  // Royal Rumble specific data
  let rumbleData = {
    mensWinner: "",
    womensWinner: "",
    mensFinal5: "",
    womensFinal5: "",
    mensSurprises: "",
    womensSurprises: ""
  };

  // ==================== RENDER FUNCTIONS ====================
  function renderTabs() {
    document.getElementById('tabs').innerHTML = `
      <button onclick="setTab(0)" id="tab0" class="tab-active flex-1 py-4">Setup</button>
      <button onclick="setTab(1)" id="tab1" class="flex-1 py-4">Players</button>
      <button onclick="setTab(2)" id="tab2" class="flex-1 py-4">Predictions</button>
      <button onclick="setTab(3)" id="tab3" class="flex-1 py-4">Results</button>
      <button onclick="setTab(4)" id="tab4" class="flex-1 py-4">Leaderboard</button>
    `;
  }

  function renderSetup() {
    const container = document.getElementById('panel0');

    let html = `
      <h2 class="text-2xl font-bold mb-4">Event Name</h2>
      <input id="eventName" type="text" value="${eventName}" placeholder="Enter Event Name..."
             oninput="updateEventName()" class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3 text-xl mb-8">

      <div class="mb-8">
        <h2 class="text-2xl font-bold mb-3">Event Type</h2>
        <div class="grid grid-cols-2 gap-4">
          <button onclick="setEventType('mania')"
                  class="py-5 rounded-2xl font-bold transition-all ${eventType === 'mania' ? 'bg-yellow-400 text-black' : 'bg-gray-700 hover:bg-gray-600'}">
            🎪 WrestleMania
          </button>
          <button onclick="setEventType('rumble')"
                  class="py-5 rounded-2xl font-bold transition-all ${eventType === 'rumble' ? 'bg-yellow-400 text-black' : 'bg-gray-700 hover:bg-gray-600'}">
            🌟 Royal Rumble
          </button>
        </div>
      </div>
    `;

    if (eventType === 'rumble') {
      html += `
        <div class="bg-yellow-900/30 border border-yellow-400 rounded-2xl p-6 mb-8">
          <p class="text-yellow-400 font-medium">Royal Rumble Mode</p>
        </div>

        <div class="space-y-8">
          <div>
            <h3 class="text-xl font-bold mb-4">Men's Royal Rumble</h3>
            <div class="grid grid-cols-1 gap-6">
              <div>
                <label class="block text-sm text-gray-400 mb-1">Winner</label>
                <input type="text" id="mensWinner" value="${rumbleData.mensWinner}"
                       oninput="updateRumbleField('mensWinner', this.value)"
                       placeholder="Who wins the Men's Rumble?"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
              <div>
                <label class="block text-sm text-gray-400 mb-1">Final 5 in the Ring</label>
                <input type="text" id="mensFinal5" value="${rumbleData.mensFinal5}"
                       oninput="updateRumbleField('mensFinal5', this.value)"
                       placeholder="Enter 5 names separated by commas"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
              <div>
                <label class="block text-sm text-gray-400 mb-1">3 Surprise Entrants</label>
                <input type="text" id="mensSurprises" value="${rumbleData.mensSurprises}"
                       oninput="updateRumbleField('mensSurprises', this.value)"
                       placeholder="Enter 3 surprise names separated by commas"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
            </div>
          </div>

          <div>
            <h3 class="text-xl font-bold mb-4">Women's Royal Rumble</h3>
            <div class="grid grid-cols-1 gap-6">
              <div>
                <label class="block text-sm text-gray-400 mb-1">Winner</label>
                <input type="text" id="womensWinner" value="${rumbleData.womensWinner}"
                       oninput="updateRumbleField('womensWinner', this.value)"
                       placeholder="Who wins the Women's Rumble?"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
              <div>
                <label class="block text-sm text-gray-400 mb-1">Final 5 in the Ring</label>
                <input type="text" id="womensFinal5" value="${rumbleData.womensFinal5}"
                       oninput="updateRumbleField('womensFinal5', this.value)"
                       placeholder="Enter 5 names separated by commas"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
              <div>
                <label class="block text-sm text-gray-400 mb-1">3 Surprise Entrants</label>
                <input type="text" id="womensSurprises" value="${rumbleData.womensSurprises}"
                       oninput="updateRumbleField('womensSurprises', this.value)"
                       placeholder="Enter 3 surprise names separated by commas"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
            </div>
          </div>
        </div>
      `;
    }

    html += `
      <div class="flex justify-between items-center mb-6 mt-10">
        <h2 class="text-2xl font-bold">Other Matches</h2>
        <button onclick="addMatch()" class="flex items-center gap-2 bg-yellow-400 hover:bg-yellow-300 text-black px-6 py-2 rounded-2xl font-medium">
          <i class="fas fa-plus"></i> Add Match
        </button>
      </div>
      <div id="matchesList" class="space-y-6"></div>
    `;

    container.innerHTML = html;
    renderMatchesList();
  }

  function renderMatchesList() {
    const list = document.getElementById('matchesList');
    if (!list) return;

    if (matches.length === 0) {
      list.innerHTML = `<p class="text-center py-16 text-gray-400">No matches yet.<br>Click "Add Match" to start.</p>`;
      return;
    }

    list.innerHTML = matches.map(m => `
      <div class="match-card bg-gray-800 rounded-3xl p-6">
        <div class="flex justify-between mb-4">
          <input value="${m.title}" oninput="updateMatchTitle(${m.id}, this.value)"
                 class="flex-1 bg-transparent text-xl font-bold focus:outline-none">
          <button onclick="deleteMatch(${m.id})" class="text-red-400"><i class="fas fa-trash"></i></button>
        </div>
        <div class="flex flex-wrap gap-3">
          ${m.participants.map((p, i) => `
            <div class="flex items-center bg-gray-700 rounded-2xl px-4 py-2">
              <input value="${p}" oninput="updateParticipant(${m.id}, ${i}, this.value)"
                     class="bg-transparent w-56 focus:outline-none">
              <button onclick="removeParticipant(${m.id}, ${i})" class="ml-3 text-gray-400 hover:text-red-400">
                <i class="fas fa-times"></i>
              </button>
            </div>
          `).join('')}
          <button onclick="addParticipant(${m.id})" class="text-yellow-400 flex items-center gap-1 text-sm">
            <i class="fas fa-plus"></i> Add Option
          </button>
        </div>
      </div>
    `).join('');
  }

  // ==================== HELPER FUNCTIONS ====================
  function updateEventName() {
    eventName = document.getElementById('eventName').value;
  }

  function setEventType(type) {
    eventType = type;
    renderSetup();
  }

  function addMatch() {
    const newId = matches.length ? Math.max(...matches.map(m => m.id)) + 1 : 1;
    matches.push({ id: newId, title: "New Match", participants: ["Option 1", "Option 2"], actualWinner: null });
    renderSetup();
  }

  function deleteMatch(id) {
    matches = matches.filter(m => m.id !== id);
    renderSetup();
  }

  function updateMatchTitle(id, title) {
    const match = matches.find(m => m.id === id);
    if (match) match.title = title;
  }

  function addParticipant(matchId) {
    const match = matches.find(m => m.id === matchId);
    if (match) match.participants.push("New Option");
    renderSetup();
  }

  function updateParticipant(matchId, idx, val) {
    const match = matches.find(m => m.id === matchId);
    if (match) match.participants[idx] = val;
  }

  function removeParticipant(matchId, idx) {
    const match = matches.find(m => m.id === matchId);
    if (match) match.participants.splice(idx, 1);
    renderSetup();
  }

  function updateRumbleField(field, value) {
    rumbleData[field] = value;
  }

  function setTab(n) {
    document.querySelectorAll('#panel0,#panel1,#panel2,#panel3,#panel4').forEach(p => p.classList.add('hidden'));
    document.getElementById(`panel${n}`).classList.remove('hidden');

    document.querySelectorAll('button[id^="tab"]').forEach(btn => btn.classList.remove('tab-active'));
    document.getElementById(`tab${n}`).classList.add('tab-active');

    if (n === 0) renderSetup();
  }

  // Init
  window.onload = () => {
    renderTabs();
    setTab(0);
    console.log("%c✅ Dual-mode app ready - Rumble mode enabled", "color:#f59e0b");
  };
</script>
</body>
</html>
