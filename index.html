<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mania Oracle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: linear-gradient(180deg, #111827, #1f2937); }
    .tab-active { border-bottom: 4px solid #f59e0b; color: #f59e0b; }
    .match-card { transition: all 0.2s; }
  </style>
</head>
<body class="min-h-screen text-white pb-12">
  <div class="max-w-5xl mx-auto p-4">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-bold flex items-center gap-3">
        <span class="text-yellow-400">👊🏻</span> Mania Oracle
      </h1>
      <div class="flex gap-3">
        <button onclick="newEvent()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm flex items-center gap-2">
          <i class="fas fa-plus"></i> New Event
        </button>
        <button onclick="exportEvent()" class="px-5 py-2.5 bg-yellow-400 hover:bg-yellow-300 text-black font-bold rounded-2xl text-sm flex items-center gap-2">
          <i class="fas fa-download"></i> Export
        </button>
        <button onclick="showImportModal()" class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-2xl text-sm flex items-center gap-2">
          <i class="fas fa-upload"></i> Import
        </button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-gray-700 mb-8 text-lg font-medium" id="tabs"></div>

    <!-- Panels -->
    <div id="panel0" class="tab-panel"></div>
    <div id="panel1" class="tab-panel hidden"></div>
    <div id="panel2" class="tab-panel hidden"></div>
    <div id="panel3" class="tab-panel hidden"></div>
    <div id="panel4" class="tab-panel hidden"></div>
  </div>

  <!-- Import Modal -->
  <div id="importModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50"></div>

<script>
  // ==================== STATE ====================
  let eventName = "";
  let eventType = "mania";   // "mania" or "rumble"
  let matches = [];
  let players = [];

  // Per-player Rumble predictions
  let playerRumblePicks = {};

  // ==================== RENDER FUNCTIONS ====================
  function renderTabs() {
    document.getElementById('tabs').innerHTML = `
      <button onclick="setTab(0)" id="tab0" class="tab-active flex-1 py-4">Setup</button>
      <button onclick="setTab(1)" id="tab1" class="flex-1 py-4">Players</button>
      <button onclick="setTab(2)" id="tab2" class="flex-1 py-4">Predictions</button>
      <button onclick="setTab(3)" id="tab3" class="flex-1 py-4">Results</button>
      <button onclick="setTab(4)" id="tab4" class="flex-1 py-4">Leaderboard</button>
    `;
  }

  function renderSetup() {
    const container = document.getElementById('panel0');

    let html = `
      <h2 class="text-2xl font-bold mb-4">Event Name</h2>
      <input id="eventName" type="text" value="${eventName}" placeholder="Enter Event Name..."
             oninput="updateEventName()" class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3 text-xl mb-8">

      <div class="mb-8">
        <h2 class="text-2xl font-bold mb-3">Event Type</h2>
        <div class="grid grid-cols-2 gap-4">
          <button onclick="setEventType('mania')"
                  class="py-5 rounded-2xl font-bold transition-all ${eventType === 'mania' ? 'bg-yellow-400 text-black' : 'bg-gray-700 hover:bg-gray-600'}">
            🎪 WrestleMania
          </button>
          <button onclick="setEventType('rumble')"
                  class="py-5 rounded-2xl font-bold transition-all ${eventType === 'rumble' ? 'bg-yellow-400 text-black' : 'bg-gray-700 hover:bg-gray-600'}">
            🌟 Royal Rumble
          </button>
        </div>
      </div>
    `;

    html += `
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Matches on the Card</h2>
        <button onclick="addMatch()" class="flex items-center gap-2 bg-yellow-400 hover:bg-yellow-300 text-black px-6 py-2 rounded-2xl font-medium">
          <i class="fas fa-plus"></i> Add Match
        </button>
      </div>
      <div id="matchesList" class="space-y-6"></div>
    `;

    container.innerHTML = html;
    renderMatchesList();
  }

  function renderMatchesList() {
    const list = document.getElementById('matchesList');
    if (!list) return;

    if (matches.length === 0) {
      list.innerHTML = `<p class="text-center py-16 text-gray-400">No matches yet.<br>Click "Add Match" to start.</p>`;
      return;
    }

    list.innerHTML = matches.map(m => `
      <div class="match-card bg-gray-800 rounded-3xl p-6">
        <div class="flex justify-between mb-4">
          <input value="${m.title}" oninput="updateMatchTitle(${m.id}, this.value)"
                 class="flex-1 bg-transparent text-xl font-bold focus:outline-none">
          <button onclick="deleteMatch(${m.id})" class="text-red-400"><i class="fas fa-trash"></i></button>
        </div>
        <div class="flex flex-wrap gap-3">
          ${m.participants.map((p, i) => `
            <div class="flex items-center bg-gray-700 rounded-2xl px-4 py-2">
              <input value="${p}" oninput="updateParticipant(${m.id}, ${i}, this.value)"
                     class="bg-transparent w-56 focus:outline-none">
              <button onclick="removeParticipant(${m.id}, ${i})" class="ml-3 text-gray-400 hover:text-red-400">
                <i class="fas fa-times"></i>
              </button>
            </div>
          `).join('')}
          <button onclick="addParticipant(${m.id})" class="text-yellow-400 flex items-center gap-1 text-sm">
            <i class="fas fa-plus"></i> Add Option
          </button>
        </div>
      </div>
    `).join('');
  }

  function renderPlayers() {
    const container = document.getElementById('panel1');
    container.innerHTML = `
      <h2 class="text-2xl font-bold mb-6">Players (max 5)</h2>
      <div id="playersList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4"></div>
      <button onclick="addPlayer()" class="mt-8 mx-auto block bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-8 py-4 rounded-2xl flex items-center gap-3">
        <i class="fas fa-user-plus"></i> Add Player
      </button>
    `;
    renderPlayersList();
  }

  function renderPlayersList() {
    const list = document.getElementById('playersList');
    if (players.length === 0) {
      list.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400"><i class="fas fa-users text-5xl mb-4"></i><p>No players yet</p></div>`;
      return;
    }

    list.innerHTML = players.map(p => `
      <div class="bg-gray-800 rounded-3xl p-6 text-center">
        <input value="${p.name}" oninput="updatePlayerName(${p.id}, this.value)"
               class="bg-transparent text-center text-2xl font-bold w-full focus:outline-none border-b border-transparent focus:border-yellow-400">
        <button onclick="deletePlayer(${p.id})" class="mt-6 text-red-400 text-sm hover:text-red-500">Remove</button>
      </div>
    `).join('');
  }

  function renderPredictions() {
    const container = document.getElementById('panel2');
    if (players.length === 0) {
      container.innerHTML = `<p class="text-center py-20 text-gray-400">Add players first in the Players tab.</p>`;
      return;
    }

    let html = `<h2 class="text-2xl font-bold mb-8">Predictions</h2>`;

    players.forEach((player, playerIndex) => {
      const playerId = player.id;
      const rumblePicks = getPlayerRumblePicks(playerId);

      html += `
        <div class="mb-10 bg-gray-900 rounded-3xl p-6">
          <div class="text-2xl font-bold mb-6 border-b border-gray-700 pb-4">${player.name}'s Picks</div>
      `;

      // Normal match predictions (show in BOTH modes)
      if (matches.length > 0) {
        html += `
          <div class="mb-8">
            <div class="text-sm text-gray-400 mb-4">Other Matches</div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${matches.map((match, matchIndex) => {
                const picked = player.picks[matchIndex];
                return `
                  <div class="bg-gray-800 rounded-2xl p-4">
                    <div class="font-medium mb-3">${match.title}</div>
                    <div class="flex flex-wrap gap-2">
                      ${match.participants.map(opt => `
                        <button onclick="makePick(${playerIndex}, ${matchIndex}, '${opt.replace(/'/g, "\\'")}')"
                                class="px-4 py-2 rounded-xl text-sm transition-all ${picked === opt ? 'bg-yellow-400 text-black' : 'bg-gray-700 hover:bg-gray-600'}">
                          ${opt}
                        </button>
                      `).join('')}
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }

      // Rumble-specific predictions (only in Rumble mode)
      if (eventType === 'rumble') {
        html += `
          <div>
            <div class="text-sm text-gray-400 mb-4">Royal Rumble Predictions</div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm text-gray-400 mb-2">Men's Rumble Winner</label>
                <input type="text" value="${rumblePicks.mensWinner}"
                       oninput="updatePlayerRumbleField(${playerId}, 'mensWinner', this.value)"
                       placeholder="Who wins Men's Rumble?"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
              <div>
                <label class="block text-sm text-gray-400 mb-2">Women's Rumble Winner</label>
                <input type="text" value="${rumblePicks.womensWinner}"
                       oninput="updatePlayerRumbleField(${playerId}, 'womensWinner', this.value)"
                       placeholder="Who wins Women's Rumble?"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
              <div>
                <label class="block text-sm text-gray-400 mb-2">Final 5 - Men's Rumble</label>
                <input type="text" value="${rumblePicks.mensFinal5}"
                       oninput="updatePlayerRumbleField(${playerId}, 'mensFinal5', this.value)"
                       placeholder="5 names, comma separated"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
              <div>
                <label class="block text-sm text-gray-400 mb-2">Final 5 - Women's Rumble</label>
                <input type="text" value="${rumblePicks.womensFinal5}"
                       oninput="updatePlayerRumbleField(${playerId}, 'womensFinal5', this.value)"
                       placeholder="5 names, comma separated"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
              <div>
                <label class="block text-sm text-gray-400 mb-2">3 Surprise Entrants - Men's</label>
                <input type="text" value="${rumblePicks.mensSurprises}"
                       oninput="updatePlayerRumbleField(${playerId}, 'mensSurprises', this.value)"
                       placeholder="3 names, comma separated"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
              <div>
                <label class="block text-sm text-gray-400 mb-2">3 Surprise Entrants - Women's</label>
                <input type="text" value="${rumblePicks.womensSurprises}"
                       oninput="updatePlayerRumbleField(${playerId}, 'womensSurprises', this.value)"
                       placeholder="3 names, comma separated"
                       class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-4 py-3">
              </div>
            </div>
          </div>
        `;
      }

      html += `</div>`;
    });

    container.innerHTML = html;
  }

  // ==================== HELPER FUNCTIONS ====================
  function getPlayerRumblePicks(playerId) {
    if (!playerRumblePicks[playerId]) {
      playerRumblePicks[playerId] = {
        mensWinner: "",
        womensWinner: "",
        mensFinal5: "",
        womensFinal5: "",
        mensSurprises: "",
        womensSurprises: ""
      };
    }
    return playerRumblePicks[playerId];
  }

  function updatePlayerRumbleField(playerId, field, value) {
    const picks = getPlayerRumblePicks(playerId);
    picks[field] = value;
  }

  function makePick(playerIndex, matchIndex, winner) {
    const player = players[playerIndex];
    if (player) {
      player.picks[matchIndex] = winner;
      renderPredictions();
    }
  }

  function updateEventName() {
    eventName = document.getElementById('eventName').value;
  }

  function setEventType(type) {
    eventType = type;
    renderSetup();
  }

  function addMatch() {
    const newId = matches.length ? Math.max(...matches.map(m => m.id)) + 1 : 1;
    matches.push({ id: newId, title: "New Match", participants: ["Option 1", "Option 2"], actualWinner: null });
    renderSetup();
    renderPredictions();
  }

  function deleteMatch(id) {
    matches = matches.filter(m => m.id !== id);
    renderSetup();
    renderPredictions();
  }

  function addParticipant(matchId) {
    const match = matches.find(m => m.id === matchId);
    if (match) {
      match.participants.push("New Option");
      renderSetup();
      renderPredictions();
    }
  }

  function updateParticipant(matchId, idx, val) {
    const match = matches.find(m => m.id === matchId);
    if (match) match.participants[idx] = val;
  }

  function removeParticipant(matchId, idx) {
    const match = matches.find(m => m.id === matchId);
    if (match) {
      match.participants.splice(idx, 1);
      renderSetup();
      renderPredictions();
    }
  }

  function addPlayer() {
    if (players.length >= 5) return alert("Maximum 5 players!");
    const newId = players.length ? Math.max(...players.map(p => p.id)) + 1 : 1;
    players.push({ id: newId, name: `Player ${players.length + 1}`, picks: {} });
    renderPlayers();
  }

  function deletePlayer(id) {
    players = players.filter(p => p.id !== id);
    renderPlayers();
  }

  function updatePlayerName(id, name) {
    const player = players.find(p => p.id === id);
    if (player) player.name = name;
  }

  function setTab(n) {
    document.querySelectorAll('#panel0,#panel1,#panel2,#panel3,#panel4').forEach(p => p.classList.add('hidden'));
    document.getElementById(`panel${n}`).classList.remove('hidden');

    document.querySelectorAll('button[id^="tab"]').forEach(btn => btn.classList.remove('tab-active'));
    document.getElementById(`tab${n}`).classList.add('tab-active');

    if (n === 0) renderSetup();
    if (n === 1) renderPlayers();
    if (n === 2) renderPredictions();
  }

  // Init
  window.onload = () => {
    renderTabs();
    setTab(0);
    console.log("%c✅ App updated - Predictions now show matches in both modes", "color:#f59e0b");
  };
</script>
</body>
</html>
